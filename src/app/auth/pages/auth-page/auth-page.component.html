<div class="auth-container">
  <div class="auth-box">
    <h2>{{ isSignUpMode ? 'Sign up' : 'Sign in' }}</h2>

    <form #authForm="ngForm" (ngSubmit)="onSubmit(authForm)" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          class="form-control"
          [class.is-invalid]="authForm.submitted && emailError"
          #emailCtrl="ngModel">
        <div *ngIf="authForm.submitted && emailError" class="invalid-feedback">
          {{ emailError }}
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          class="form-control"
          [class.is-invalid]="authForm.submitted && passwordError"
          #passwordCtrl="ngModel">
        <div *ngIf="authForm.submitted && passwordError" class="invalid-feedback">
          {{ passwordError }}
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-submit"
        [disabled]="!authForm.valid || emailError || passwordError">
        {{ isSignUpMode ? 'Sign up' : 'Sign in' }}
      </button>
    </form>

    <div class="toggle-mode">
      {{ isSignUpMode ? 'Already have an account?' : 'Don’t have an account?' }}
      <button (click)="toggleMode()" class="link-btn">
        {{ isSignUpMode ? 'Sign in' : 'Sign up' }}
      </button>
    </div>
  </div>
</div>
