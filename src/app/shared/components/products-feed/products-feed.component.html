<div class="products-container">
  @if (products.length === 0) {
    <h1>No products found</h1>
  } @else {
    <div class="results-info">
      <h2>Found {{ products.length }} product(s)</h2>
    </div>
    <div class="products-grid">
      @for (product of products; track product.id) {
        <div class="product-card">
          <a [routerLink]="['/product', product.id]">
            <img [src]="product.image" [alt]="product.title" class="product-image">
            <div class="product-title">{{ product.title }}</div>
          </a>
          <div class="product-actions">
            <app-add-to-cart [product]="product"></app-add-to-cart>
            <button class="btn btn-edit" [routerLink]="['/product/edit', product.id]">
              <i class="fas fa-edit"></i> Edit
            </button>
            <button class="btn btn-delete" (click)="deleteProduct(product.id)">
              <i class="fas fa-trash-alt"></i> Delete
            </button>
          </div>

          <div class="product-footer">
            <span class="rating">{{ product.rating.rate }}★</span>
            <span class="price">${{ product.price }}</span>
          </div>
        </div>
      }
    </div>
  }
</div>
